image: hub.nexdev.net/base/alpine:3.17.2

variables:
  DIR_TOOL: "awx goHarbor"

package-directory-script:
  script:
    - |
      for dir in $DIR_TOOL
      do
        zip -r ${dir}-script-install.zip $dir
        toolDirZipper=${dir}-script-install.zip
        lftp -e 'set ssl:verify-certificate no; set ftp:ssl-allow true; set ftp:ssl-force true; put "$toolDirZipper" -o "/awx-tower/$toolDirZipper"; quit' -u 'nexops,R_v4FyaGRC_Kf4D' 'ftp://ftpd-backup.nexdev.net:2023'
        rm -rf $toolDirZipper
      done

